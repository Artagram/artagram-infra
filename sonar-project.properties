# Configuración de SonarQube Cloud para artagram-infra.
# La organización se pasa desde el workflow (variable SONAR_ORGANIZATION).
sonar.projectKey=Artagram_artagram-infra
sonar.projectName=artagram-infra
sonar.sources=.
sonar.exclusions=docs/**,**/*.drawio,secrets-dev/**

# Falsos positivos justificados:
# e1: rabbitmq/definitions.json solo se usa en local (compose.yml) con las
#     credenciales de desarrollo de .env.example. En AWS la imagen se construye
#     desde definitions.json.template con los secrets de GitHub (build-rabbitmq.yml).
# e2: la imagen oficial de RabbitMQ arranca como root a propósito:
#     docker-entrypoint.sh baja privilegios al usuario "rabbitmq" antes de
#     iniciar el broker (ver comentarios en rabbitmq/entrypoint-wrapper.sh).
sonar.issue.ignore.multicriteria=e1,e2
sonar.issue.ignore.multicriteria.e1.ruleKey=json:S2068
sonar.issue.ignore.multicriteria.e1.resourceKey=rabbitmq/definitions.json
sonar.issue.ignore.multicriteria.e2.ruleKey=docker:S6471
sonar.issue.ignore.multicriteria.e2.resourceKey=rabbitmq/Dockerfile
