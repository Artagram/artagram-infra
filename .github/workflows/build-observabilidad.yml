name: Build and deploy Prometheus and Grafana

# Prometheus y Grafana son imágenes oficiales con la configuración de
# observabilidad/ horneada (en Fargate no hay volúmenes de configuración).
# Se reconstruyen solo cuando cambia esa configuración.

on:
  push:
    branches: [main]
    paths:
      - "observabilidad/**"
      - "ecs/task-definitions/artagram-prometheus.json"
      - "ecs/task-definitions/artagram-grafana.json"
      - ".github/workflows/build-observabilidad.yml"
  workflow_dispatch: {}

env:
  AWS_REGION: us-east-1
  ECS_CLUSTER: artagram-cluster

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    strategy:
      matrix:
        componente: [prometheus, grafana]
    concurrency:
      group: deploy-artagram-${{ matrix.componente }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login en Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2

      - name: Build y push de la imagen
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          ECR_REPOSITORY: artagram-${{ matrix.componente }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" "observabilidad/${{ matrix.componente }}"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Renderizar la task definition
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ env.AWS_REGION }}
          IMAGE_URI: ${{ steps.build-image.outputs.image }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
        run: |
          if [ "${{ matrix.componente }}" = grafana ] && [ -z "$GRAFANA_ADMIN_PASSWORD" ]; then
            echo "::error::Falta el secret GRAFANA_ADMIN_PASSWORD"; exit 1
          fi
          envsubst < "ecs/task-definitions/artagram-${{ matrix.componente }}.json" > rendered-task-def.json

      - name: Deploy a ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@a00d4d57ac0de1a99b39fe469f3d898d38717c2b # v2
        with:
          task-definition: rendered-task-def.json
          service: artagram-${{ matrix.componente }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
