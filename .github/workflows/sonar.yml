name: Análisis estático (SonarQube Cloud)

# artagram-infra no tiene build propio, así que su análisis vive en este
# workflow aparte (Docker Compose, scripts, workflows, SQL, Java de
# scripts/). Los microservicios se analizan dentro de deploy-service.yml y
# el frontend en su propio ci-cd.yml.
#
# Solo reporta: no bloquea el merge. Si el secret SONAR_TOKEN no existe el
# análisis se omite.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

jobs:
  sonar:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Análisis estático (SonarQube Cloud)
        if: env.SONAR_TOKEN != ''
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@v5
        with:
          args: >
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION || 'artagram' }}
