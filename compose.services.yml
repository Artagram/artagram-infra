name: artagram

services:
  artagram-gateway:
    build:
      context: ../artagram-gateway
      dockerfile: Dockerfile
    container_name: artagram-gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    environment:
      SERVER_PORT: 8080
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DATABASE: 1
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      GATEWAY_JWT_ENABLED: ${GATEWAY_JWT_ENABLED:-false}
      AUTH_JWKS_URI: http://artagram-auth:8081/.well-known/jwks.json
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://artagram-auth:8081}
      USERS_SERVICE_URL: ${USERS_SERVICE_URL:-http://artagram-users:8082}
      FEED_SERVICE_URL: ${FEED_SERVICE_URL:-http://artagram-feed:8083}
      CHAT_SERVICE_URL: ${CHAT_SERVICE_URL:-http://artagram-chat:8085}
      # artagram-lienzo (backv1) solo le queda /api/admin/** (KPIs) — ver admin-route
      LIENZO_SERVICE_URL: ${LIENZO_SERVICE_URL:-http://artagram-lienzo:8080}
      CANVAS_SERVICE_URL: ${CANVAS_SERVICE_URL:-http://artagram-canvas:8088}
      CANVAS_WS_URL: ${CANVAS_WS_URL:-ws://artagram-canvas:8088}
      PAYMENT_SERVICE_URL: ${PAYMENT_SERVICE_URL:-http://artagram-payment:8089}
      NOTIFICATIONS_SERVICE_URL: ${NOTIFICATIONS_SERVICE_URL:-http://artagram-notifications:8090}
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx256m -XX:+UseSerialGC -XX:MaxMetaspaceSize=128m"
    deploy:
      resources:
        limits:
          memory: 384M
    depends_on:
      redis:
        condition: service_healthy
      artagram-auth:
        condition: service_healthy
      artagram-users:
        condition: service_healthy
      artagram-feed:
        condition: service_healthy
      artagram-chat:
        condition: service_healthy
      artagram-lienzo:
        condition: service_healthy
      artagram-canvas:
        condition: service_healthy
      artagram-payment:
        condition: service_healthy
      artagram-notifications:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - artagram-net

  artagram-auth:
    build:
      context: ../artagram-auth
      dockerfile: Dockerfile
    container_name: artagram-auth
    restart: unless-stopped
    ports:
      - "${AUTH_PORT:-8081}:8081"
    environment:
      SERVER_PORT: 8081
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: db_auth
      DB_USER: ${POSTGRES_USER:-artagram}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-artagram}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/db_auth
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-artagram}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-artagram}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-artagram}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-artagram}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-artagram}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-artagram}
      JWT_PRIVATE_KEY_PATH: /app/secrets-dev/jwt-private.pem
      JWT_PUBLIC_KEY_PATH: /app/secrets-dev/jwt-public.pem
      EMAIL_MODE: ${EMAIL_MODE:-log}
      VERIFICACION_CORREO: ${VERIFICACION_CORREO:-false}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:5173}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-seed}
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx256m -XX:+UseSerialGC -XX:MaxMetaspaceSize=128m"
    volumes:
      - ./secrets-dev:/app/secrets-dev:ro
    deploy:
      resources:
        limits:
          memory: 384M
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - artagram-net

  artagram-users:
    build:
      context: ../artagram-users
      dockerfile: Dockerfile
    container_name: artagram-users
    restart: unless-stopped
    ports:
      - "${USERS_PORT:-8082}:8082"
    environment:
      SERVER_PORT: 8082
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: db_usuarios
      DB_USER: ${POSTGRES_USER:-artagram}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-artagram}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-artagram}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-artagram}
      AUTH_JWKS_URI: http://artagram-auth:8081/.well-known/jwks.json
      JWT_PUBLIC_KEY_PATH: /app/secrets-dev/jwt-public.pem
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-s3}
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_BUCKET: ${S3_BUCKET:-artagram-uploads}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-artagram}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-artagram123}
      S3_REGION: us-east-1
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-fake}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-seed}
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx256m -XX:+UseSerialGC -XX:MaxMetaspaceSize=128m"
    volumes:
      - ./secrets-dev:/app/secrets-dev:ro
    deploy:
      resources:
        limits:
          memory: 384M
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - artagram-net

  artagram-feed:
    build:
      context: ../artagram-feed
      dockerfile: Dockerfile
    container_name: artagram-feed
    restart: unless-stopped
    ports:
      - "${FEED_PORT:-8083}:8083"
    environment:
      SERVER_PORT: 8083
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: db_feed
      DB_USER: ${POSTGRES_USER:-artagram}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-artagram}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-artagram}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-artagram}
      JWT_PUBLIC_KEY_PATH: /app/secrets-dev/jwt-public.pem
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-s3}
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_BUCKET: ${S3_BUCKET:-artagram-uploads}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-artagram}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-artagram123}
      S3_REGION: us-east-1
      APP_API_BASE_URL: http://localhost:8080
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-seed}
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx256m -XX:+UseSerialGC -XX:MaxMetaspaceSize=128m"
    volumes:
      - ./secrets-dev:/app/secrets-dev:ro
    deploy:
      resources:
        limits:
          memory: 384M
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - artagram-net

  artagram-lienzo:
    build:
      context: ../ARTAGRAM-backv1
      dockerfile: Dockerfile
    container_name: artagram-lienzo
    restart: unless-stopped
    ports:
      - "${LIENZO_PORT:-8084}:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${LIENZO_DB_NAME:-artagram}
      DB_USER: ${POSTGRES_USER:-artagram}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-artagram}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-artagram}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-artagram}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-artagram}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-artagram}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-secreto-desarrollo-minimo-32-bytes-longitud-segura-artagram}
      JWT_PUBLIC_KEY_PATH: /app/secrets-dev/jwt-public.pem
      JWT_JWKS_URI: http://artagram-auth:8081/.well-known/jwks.json
      MEDIA_SIGNING_SECRET: ${MEDIA_SIGNING_SECRET:-secreto-firma-media-desarrollo-32-bytes}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:5173}
      APP_API_BASE_URL: ${APP_API_BASE_URL:-http://localhost:8080}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-s3}
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_BUCKET: ${S3_BUCKET:-artagram-uploads}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-artagram}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-artagram123}
      S3_REGION: us-east-1
      EMAIL_MODE: ${EMAIL_MODE:-log}
      VERIFICACION_CORREO: ${VERIFICACION_CORREO:-false}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODELO: ${GROQ_MODELO:-qwen/qwen3.8-27b}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-seed}
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx512m -XX:+UseSerialGC -XX:MaxMetaspaceSize=192m"
    volumes:
      - ./secrets-dev:/app/secrets-dev:ro
    deploy:
      resources:
        limits:
          memory: 896M
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - artagram-net

  artagram-chat:
    build:
      context: ../artagram-chat
      dockerfile: Dockerfile
    container_name: artagram-chat
    restart: unless-stopped
    ports:
      - "${CHAT_PORT:-8085}:8085"
    environment:
      SERVER_PORT: 8085
      SPRING_DATA_MONGODB_URI: mongodb://${MONGO_USER:-artagram}:${MONGO_PASSWORD:-artagram}@mongodb:27017/db_chat?authSource=admin
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-artagram}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-artagram}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-artagram}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-artagram}
      AUTH_JWKS_URI: http://artagram-auth:8081/.well-known/jwks.json
      LIENZO_INTERNAL_URL: http://artagram-lienzo:8080
      JWT_PUBLIC_KEY_PATH: /app/secrets-dev/jwt-public.pem
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-seed}
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx256m -XX:+UseSerialGC -XX:MaxMetaspaceSize=128m"
    volumes:
      - ./secrets-dev:/app/secrets-dev:ro
    deploy:
      resources:
        limits:
          memory: 384M
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8085/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - artagram-net

  artagram-media-worker:
    build:
      context: ../artagram-media-worker
      dockerfile: Dockerfile
    container_name: artagram-media-worker
    restart: unless-stopped
    ports:
      - "${MEDIA_WORKER_PORT:-8086}:8086"
    environment:
      SERVER_PORT: 8086
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-artagram}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-artagram}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-artagram-uploads}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-artagram}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-artagram123}
      S3_REGION: us-east-1
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx256m -XX:+UseSerialGC -XX:MaxMetaspaceSize=128m"
    deploy:
      resources:
        limits:
          memory: 384M
    depends_on:
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8086/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - artagram-net

  artagram-ai-worker:
    build:
      context: ../artagram-ai-worker
      dockerfile: Dockerfile
    container_name: artagram-ai-worker
    restart: unless-stopped
    ports:
      - "${AI_WORKER_PORT:-8087}:8087"
    environment:
      SERVER_PORT: 8087
      SPRING_DATA_MONGODB_URI: mongodb://${MONGO_USER:-artagram}:${MONGO_PASSWORD:-artagram}@mongodb:27017/db_ia?authSource=admin
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-artagram}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-artagram}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-artagram-uploads}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-artagram}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-artagram123}
      S3_REGION: us-east-1
      LLM_PROVIDER: ${LLM_PROVIDER:-fake}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODELO: ${GROQ_MODELO:-qwen/qwen3.8-27b}
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx256m -XX:+UseSerialGC -XX:MaxMetaspaceSize=128m"
    deploy:
      resources:
        limits:
          memory: 384M
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8087/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - artagram-net

  artagram-canvas:
    build:
      context: ../artagram-canvas
      dockerfile: Dockerfile
    container_name: artagram-canvas
    restart: unless-stopped
    ports:
      # El gateway ya enruta /api/comunidades/**, /api/fiestas/** aqui
      # (canvas-rest-route). /ws sigue en artagram-lienzo hasta que banner y
      # el chat de comunidad/personal por STOMP terminen de migrarse.
      - "${CANVAS_PORT:-8088}:8088"
    environment:
      SERVER_PORT: 8088
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: db_lienzo
      DB_USER: ${POSTGRES_USER:-artagram}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-artagram}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-artagram}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-artagram}
      JWT_PUBLIC_KEY_PATH: /app/secrets-dev/jwt-public.pem
      LIENZO_INTERNAL_URL: http://artagram-lienzo:8080
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_BUCKET: ${S3_BUCKET:-artagram-uploads}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-artagram}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-artagram123}
      S3_REGION: us-east-1
      S3_PATH_STYLE: "true"
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-seed}
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx256m -XX:+UseSerialGC -XX:MaxMetaspaceSize=128m"
    volumes:
      - ./secrets-dev:/app/secrets-dev:ro
    deploy:
      resources:
        limits:
          memory: 384M
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      artagram-lienzo:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8088/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - artagram-net

  artagram-payment:
    build:
      context: ../artagram-payment
      dockerfile: Dockerfile
    container_name: artagram-payment
    restart: unless-stopped
    ports:
      - "${PAYMENT_PORT:-8089}:8089"
    environment:
      SERVER_PORT: 8089
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: db_payment
      DB_USER: ${POSTGRES_USER:-artagram}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-artagram}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-artagram}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-artagram}
      JWT_PUBLIC_KEY_PATH: /app/secrets-dev/jwt-public.pem
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      PAGO_PROVEEDOR: ${PAGO_PROVEEDOR:-fake}
      MP_ACCESS_TOKEN: ${MP_ACCESS_TOKEN:-}
      MERCADOPAGO_WEBHOOK_SECRET: ${MERCADOPAGO_WEBHOOK_SECRET:-}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-seed}
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx256m -XX:+UseSerialGC -XX:MaxMetaspaceSize=128m"
    volumes:
      - ./secrets-dev:/app/secrets-dev:ro
    deploy:
      resources:
        limits:
          memory: 384M
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8089/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - artagram-net

  artagram-notifications:
    build:
      context: ../artagram-notifications
      dockerfile: Dockerfile
    container_name: artagram-notifications
    restart: unless-stopped
    ports:
      - "${NOTIFICATIONS_PORT:-8090}:8090"
    environment:
      SERVER_PORT: 8090
      SPRING_DATA_MONGODB_URI: mongodb://${MONGO_USER:-artagram}:${MONGO_PASSWORD:-artagram}@mongodb:27017/db_notificaciones?authSource=admin
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: notifications
      RABBITMQ_PASSWORD: ${NOTIFICATIONS_RABBITMQ_PASSWORD:-notifications_secret}
      RABBITMQ_VHOST: notifications
      JWT_PUBLIC_KEY_PATH: /app/secrets-dev/jwt-public.pem
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      EMAIL_MODE: ${EMAIL_MODE:-log}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-seed}
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx256m -XX:+UseSerialGC -XX:MaxMetaspaceSize=128m"
    volumes:
      - ./secrets-dev:/app/secrets-dev:ro
    deploy:
      resources:
        limits:
          memory: 384M
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8090/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - artagram-net
