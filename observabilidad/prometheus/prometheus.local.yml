# Generado para docker compose local. Cada job descubre TODAS las replicas de su servicio
# por el nombre del contenedor, asi el p95 se calcula sumando las replicas (escenarios 1, 2 y 10).
global:
  scrape_interval: 10s
  evaluation_interval: 10s
  external_labels:
    entorno: local

rule_files:
  - /etc/prometheus/alertas.yml

scrape_configs:
  - job_name: gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["artagram-gateway:8080"]
  - job_name: auth
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["artagram-auth:8081"]
  - job_name: users
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["artagram-users:8082"]
  - job_name: feed
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["artagram-feed:8083"]
  - job_name: canvas
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["artagram-canvas:8084"]
  - job_name: chat
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["artagram-chat:8085"]
  - job_name: media-worker
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["artagram-media-worker:8086"]
  - job_name: ai-worker
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["artagram-ai-worker:8087"]
  - job_name: payment
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["artagram-payment:8089"]
  - job_name: notifications
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["artagram-notifications:8090"]
