apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    # En AWS Prometheus se registra en Cloud Map; en compose es el contenedor.
    url: ${PROMETHEUS_URL}
    isDefault: true
    jsonData:
      timeInterval: 10s
      # Muestra en Grafana > Alerting las reglas que evalua Prometheus.
      manageAlerts: true
